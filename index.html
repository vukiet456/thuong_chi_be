<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xin lỗi công chúa mà! ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .header {
            text-align: center;
            color: #d63384;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 1.1rem;
            color: #6c757d;
        }

        .hit-counter {
            font-size: 1.2rem;
            font-weight: bold;
            color: #dc3545;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        /* Khung chứa người que */
        .stickman-container {
            position: relative;
            width: 220px;
            height: 320px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hình vẽ người que SVG */
        .stickman {
            width: 100%;
            height: 100%;
            transition: transform 0.05s ease;
        }

        /* Hiệu ứng khi bị đánh */
        .hit-animation {
            animation: hitShake 0.25s ease-in-out;
        }

        @keyframes hitShake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(0.9) rotate(-12deg) translateY(10px); }
            40% { transform: scale(1.05) rotate(10deg) translateY(-5px); }
            60% { transform: scale(0.95) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Dòng chữ xin lỗi bay lên */
        .apology-text {
            position: absolute;
            font-size: 0.95rem;
            font-weight: bold;
            color: #e63946;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 5px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
            white-space: nowrap;
            animation: floatUp 1.2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            50% {
                transform: translateY(-40px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tha lỗi cho anh nha! 🥺</h1>
        <p>Ấn vào anh người que ở dưới để trút giận nè!</p>
    </div>

    <div class="hit-counter">
        Đã ăn đòn: <span id="count">0</span> cái 💥
    </div>

    <div class="stickman-container" id="stickmanBox">
        <svg class="stickman" id="stickman" viewBox="0 0 100 150" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none">
            <!-- Đầu người que (trơn, không có mặt) -->
            <circle cx="50" cy="30" r="18" fill="#fff" />

            <!-- Thân -->
            <line x1="50" y1="48" x2="50" y2="95" />

            <!-- Tay (Co ro cầu xin) -->
            <path d="M 50 60 L 35 75 L 45 80" />
            <path d="M 50 60 L 65 75 L 55 80" />

            <!-- Chân -->
            <line x1="50" y1="95" x2="32" y2="135" />
            <line x1="50" y1="95" x2="68" y2="135" />
        </svg>
    </div>

    <script>
        const stickmanBox = document.getElementById('stickmanBox');
        const stickman = document.getElementById('stickman');
        const countDisplay = document.getElementById('count');
        
        let hitCount = 0;

        // Danh sách các câu xin lỗi ngọt ngào + hài hước
        const apologyMessages = [
            "Anh xin lỗi mà! 🥺",
            "Đừng giận anh nữa nha ❤️",
            "Anh biết lỗi rồi! 😭",
            "Đánh thêm cái nữa cho chừa nè!",
            "Anh hứa không tái phạm nữa đâu 💖",
            "Yêu em nhất trên đời luôn! 💕",
            "Nào, cười cái cho anh vui đi!",
            "Anh xin lỗi em nhiều lắm!",
            "Tha lỗi cho anh nha bé ơi 🥺",
            "Đừng nhíu mày nữa, xấu lắm đó!",
            "Anh bắt đầu thấy đau rồi nè 😂",
            "Yêu em nhiều lắm lắm lắm!"
        ];

        stickmanBox.addEventListener('click', (e) => {
            // Tăng số lượt đánh
            hitCount++;
            countDisplay.innerText = hitCount;

            // Kích hoạt hiệu ứng lắc/nảy
            stickman.classList.remove('hit-animation');
            void stickman.offsetWidth; // Trigger reflow
            stickman.classList.add('hit-animation');

            // Tạo dòng chữ xin lỗi bay lên
            createApologyText(e);
        });

        function createApologyText(event) {
            const textElement = document.createElement('div');
            textElement.classList.add('apology-text');

            // Chọn ngẫu nhiên một câu xin lỗi
            const randomMsg = apologyMessages[Math.floor(Math.random() * apologyMessages.length)];
            textElement.innerText = randomMsg;

            // Tính toán vị trí xuất hiện quanh điểm click
            const rect = stickmanBox.getBoundingClientRect();
            const x = event.clientX - rect.left + (Math.random() * 40 - 20);
            const y = event.clientY - rect.top - 20;

            textElement.style.left = `${x}px`;
            textElement.style.top = `${y}px`;

            stickmanBox.appendChild(textElement);

            // Tự động xóa element sau khi hiệu ứng kết thúc
            setTimeout(() => {
                textElement.remove();
            }, 1200);
        }
    </script>
</body>
</html>
